    <!-- Wheels -->
    <circle cx="14" cy="30" r="4" fill="#FFFFFF"/>
    <circle cx="34" cy="30" r="4" fill="#FFFFFF"/>
    <!-- Eco Leaf -->
    <path d="M38 10 C46 6, 48 0, 48 0 C48 0, 42 2, 38 10 Z" fill="#10B981"/>
    <path d="M42 6 C40 1, 35 2, 35 2 C35 2, 37 5, 42 6 Z" fill="#34D399"/>
    <!-- Charging Bolt -->
    <path d="M25 4 L21 11 L25 11 L23 18 L29 10 L25 10 Z" fill="#FBBF24"/>
