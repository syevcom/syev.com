<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Background with slight rounded corner -->
  <rect width="100" height="100" rx="22" fill="#0A192F"/>
  
  <!-- Stylized SY Text -->
  <text x="14" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="-2">SY</text>
  
  <!-- .com text -->
  <text x="14" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#60A5FA" letter-spacing="-0.5">.com</text>
  
  <!-- Eco EV Car / Electric Plug Symbol -->
  <g transform="translate(48, 22)">
    <!-- Car body silhouette -->
    <path d="M6 24 C8 16, 12 12, 22 12 L30 12 C36 12, 40 16, 42 24 L44 27 C44 29, 42 30, 39 30 L9 30 C6 30, 4 29, 4 27 Z" fill="#3B82F6"/>
